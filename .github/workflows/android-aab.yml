# Google Play 上傳用的 AAB(正式版,用上傳金鑰簽章)
# 只在需要時手動執行:GitHub → Actions → Android AAB(Google Play)→ Run workflow(Branch 選 main)
# 完成後在該次執行頁面最下方 Artifacts 下載 yy-android-aab(zip 裡是 .aab),再到 Play Console 上傳
#
# 需要的 Secrets(Settings → Secrets and variables → Actions):
#   ANDROID_UPLOAD_KEYSTORE_BASE64  上傳金鑰檔 yy-upload.jks 的 base64
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD 金鑰密碼
#   ANDROID_UPLOAD_KEY_ALIAS         別名(yyupload)
#   ANDROID_UPLOAD_KEY_PASSWORD      金鑰密碼(和上面相同)
#   GOOGLE_SERVICES_JSON             Firebase 設定檔(推播)
#
# versionCode = 執行編號×10+重跑次數,每次執行都會變大(Google Play 規定每次上傳都要比上一版大)
name: Android AAB (Google Play)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '版本名稱(使用者看得到,例如 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Firebase 設定檔
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ] || ! printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '"package_name": *"yy.assistant.tw"'; then
            echo "::error::GOOGLE_SERVICES_JSON 沒有設定或不是 yy.assistant.tw 的設定檔,上架版一定要有推播,停止建置"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "VITE_NATIVE_PUSH=1" >> "$GITHUB_ENV"

      - name: 上傳金鑰
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少上傳金鑰的 Secrets(ANDROID_UPLOAD_KEYSTORE_BASE64、ANDROID_UPLOAD_KEYSTORE_PASSWORD、ANDROID_UPLOAD_KEY_ALIAS、ANDROID_UPLOAD_KEY_PASSWORD)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - run: npm run build:native

      - name: 建置 AAB
        working-directory: frontend/android
        env:
          VERSION_CODE: ${{ github.run_number }}${{ github.run_attempt }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon

      - name: 確認有簽章、重新命名
        run: |
          f=android/app/build/outputs/bundle/release/app-release.aab
          if jarsigner -verify "$f" | grep -q "jar verified"; then echo "簽章正確"; else echo "::error::AAB 沒有簽章"; exit 1; fi
          mv "$f" "android/app/build/outputs/bundle/release/YY手帳-${{ inputs.version_name }}-${{ github.run_number }}${{ github.run_attempt }}.aab"

      - name: 清除金鑰
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v5
        with:
          name: yy-android-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
